[package]
name = "octofhir-wasm"
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
authors = ["OctoFHIR Team"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/octofhir/wasm"
description = "FHIR validator, FHIRPath, UCUM, SQL on FHIR and FML in the browser"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fml-check = { version = "0.2.4", default-features = false, features = ["fhirschema"] }
fml-engine = { version = "0.2.4", default-features = false, features = ["fhirpath"] }
fml-model = "0.2.4"
fml-syntax = "0.2.4"
octofhir-fhirpath = { version = "0.5.9", default-features = false }
octofhir-fhirschema = { version = "0.3.42", default-features = false }
octofhir-sof = { version = "0.3.5", default-features = false }
octofhir-ucum = { version = "0.9.3", default-features = false }
serde = "1"
serde-wasm-bindgen = "0.6"
serde_json = "1"
# Randomness comes from the browser on this target.
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# moka cannot run on wasm32-unknown-unknown: it reads a clock that panics there.
[patch.crates-io]
moka = { path = "shims/moka" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]
