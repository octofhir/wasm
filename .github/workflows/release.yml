name: Release

# Pushing a `vX.Y.Z` tag builds the web module and publishes it to npm: `@octofhir/wasm` with
# all four FHIR versions, `@octofhir/wasm-r4` and `@octofhir/wasm-r5` with one each.
# Publishes through npm trusted publishing (OIDC): each package names this repository and this
# workflow as its trusted publisher on npmjs.com; no token is stored here. Provenance comes with it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: "@octofhir/wasm"
            versions: ""
          - package: "@octofhir/wasm-r4"
            versions: R4
          - package: "@octofhir/wasm-r5"
            versions: R5
    env:
      OCTOFHIR_FHIR_VERSIONS: ${{ matrix.versions }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm
        run: npm install -g npm@latest
      - name: wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Smoke test
        run: |
          wasm-pack build --dev --target nodejs --out-dir pkg-node
          node tests/smoke.mjs
      - name: Build
        run: wasm-pack build --release --target web --out-dir pkg
      - name: Name the package
        run: |
          jq --arg name "${{ matrix.package }}" '.name = $name
              | .repository = {"type": "git", "url": "https://github.com/octofhir/wasm"}
              | .license = "MIT OR Apache-2.0"' pkg/package.json > pkg/package.next
          mv pkg/package.next pkg/package.json
          cp README.md pkg/README.md
      - name: Publish
        working-directory: pkg
        run: npm publish --access public
      - name: GitHub release
        if: matrix.package == '@octofhir/wasm'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
